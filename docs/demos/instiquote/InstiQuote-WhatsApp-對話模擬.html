(() => {
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function button(text, className, listener) {
    const node = element('button', className, text);
    node.type = 'button';
    node.addEventListener('click', listener);
    return node;
  }

  function addField(parent, id, label, input) {
    const field = element('div', 'field');
    const caption = element('label', '', label);
    caption.htmlFor = id;
    input.id = id;
    field.append(caption, input);
    parent.append(field);
    return input;
  }

  function numberField(parent, name, label, value, max, step = 1) {
    const input = element('input');
    Object.assign(input, { type: 'number', min: String(step), max: String(max), step: String(step), value: String(value), required: true });
    return addField(parent, 'sim-' + name, label, input);
  }

  function textField(parent, name, label, value, placeholder, required = false) {
    const input = element('textarea');
    Object.assign(input, { rows: 2, maxLength: 350, value: value || '', placeholder, required });
    return addField(parent, 'sim-' + name, label, input);
  }

  function submitButton(form, text, handler) {
    const save = element('button', 'portal-cta', text);
    save.type = 'submit';
    form.append(save);
    form.onsubmit = event => {
      event.preventDefault();
      handler();
    };
    return save;
  }

  function scheduleFor(sessions, hours) {
    const byMonth = new Map();
    const date = new Date(Date.UTC(2027, 0, 5));
    for (let index = 0; index < sessions; index++) {
      const month = date.getUTCMonth() + 1;
      if (!byMonth.has(month)) byMonth.set(month, []);
      byMonth.get(month).push(date.getUTCDate());
      date.setUTCDate(date.getUTCDate() + (date.getUTCDay() === 2 ? 2 : 5));
    }
    const dates = Array.from(byMonth, ([month, days]) => month + ' 月 ' + days.join('、') + ' 日').join('，');
    const endMinutes = 600 + Math.round(hours * 60);
    const end = String(Math.floor(endMinutes / 60)).padStart(2, '0') + ':' + String(endMinutes % 60).padStart(2, '0');
    return '2027 年 ' + dates + '，每節 10:00–' + end;
  }

  window.renderSimPortal = function renderSimPortal({ type, role, data, container, complete, cancel }) {
    container.replaceChildren();
    container.scrollTop = 0;
    const head = (title, lead) => {
      container.append(element('div', 'eyebrow', 'IQ-1203 · 小六升中面試班'), element('h2', '', title), element('p', 'portal-lead', lead));
    };
    const note = (text, className = 'portal-info') => {
      const block = element('p', className, text);
      container.append(block);
      return block;
    };
    const makeForm = () => {
      const form = element('form');
      const fields = element('div', 'fields');
      form.append(fields);
      container.append(form);
      return { form, fields };
    };

    if (type === 'formal' && role === 'teacher') {
      head('核對正式課程表', '請核對供應商將會收到的資料。儲存後，回到 WhatsApp 查閱最新摘要，再確認派單。');
      const { form, fields } = makeForm();
      const tutors = numberField(fields, 'tutors', '每節同時上課的導師人數', data.tutors ?? 3, 30);
      const sessions = numberField(fields, 'sessions', '全期節數', data.sessions ?? 8, 32);
      const hours = numberField(fields, 'hours', '每節時數', data.hours ?? 2, 8, 0.5);
      const schedule = element('p', 'portal-info');
      schedule.setAttribute('aria-live', 'polite');
      fields.append(schedule);
      function updateSchedule() {
        schedule.textContent = sessions.validity.valid && hours.validity.valid
          ? '上課安排　' + scheduleFor(sessions.valueAsNumber, hours.valueAsNumber)
          : '填妥節數及時數後會顯示上課日期。';
      }
      sessions.addEventListener('input', updateSchedule);
      hours.addEventListener('input', updateSchedule);
      updateSchedule();
      fields.append(element('div', 'portal-info', '報價表須分列教材、必收交通費及全期總額。截標時間為 12 月 3 日 17:00（香港時間）。'));
      const fees = textField(fields, 'fees', '其他收費要求（選填）', data.fees, '例如：請列明每名學生的教材費。');
      submitButton(form, '儲存正式需求，返回對話', () => {
        const next = { tutors: tutors.valueAsNumber, sessions: sessions.valueAsNumber, hours: hours.valueAsNumber, fees: fees.value.trim() };
        const changed = Object.entries(next).some(([key, value]) => data[key] !== value);
        const previous = Number(data.version) || 1;
        Object.assign(data, next, {
          schedule: scheduleFor(next.sessions, next.hours),
          version: previous + (data.formalSaved && changed ? 1 : 0),
          formalSaved: true
        });
        complete();
      });
      return;
    }

    if (type === 'backup' && role === 'teacher') {
      head('備份校方開標私鑰', '正式服務會讓校方把開標私鑰保存在自己的裝置。這裏可以下載示範備份，試走一次保存流程。');
      note('示範檔不能開標。檔案只含示範標記及詢價編號。');
      let downloaded = false;
      const status = element('p', 'portal-status', '請先下載示範檔。');
      status.setAttribute('role', 'status');
      const acknowledge = element('input');
      acknowledge.type = 'checkbox';
      acknowledge.disabled = true;
      const download = button('下載示範備份檔', 'portal-secondary', () => {
        const contents = { notice: '示範檔不能開標', demo: true, inquiry: 'IQ-1203' };
        const url = URL.createObjectURL(new Blob([JSON.stringify(contents, null, 2)], { type: 'application/json' }));
        const link = element('a');
        link.download = 'IQ-1203-示範備份-不能開標.json';
        link.href = url;
        container.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        downloaded = true;
        acknowledge.disabled = false;
        status.textContent = '已要求瀏覽器下載。請在「下載項目」或檔案 App 找到示範檔，再勾選確認。';
      });
      const label = element('label', 'field');
      label.style.display = 'block';
      label.append(acknowledge, document.createTextNode(' 我已找到剛下載的示範備份檔。'));
      const done = button('已保存，返回 WhatsApp', 'portal-cta', () => {
        if (!downloaded || !acknowledge.checked) return;
        data.backupAcknowledged = true;
        complete();
      });
      done.disabled = true;
      acknowledge.onchange = () => { done.disabled = !downloaded || !acknowledge.checked; };
      container.append(download, status, label, done);
      return;
    }

    if (type === 'submit' && role === 'supplier') {
      const revision = (Number(data.submissionVersion) || 0) + 1;
      head(revision === 1 ? '提交本公司的示範報價' : '交回本公司的修訂版', '以下使用內置樣本模擬供應商裝置封存報價和收取回條。');
      note('樣本 PDF　小六升中面試班報價單.pdf');
      note('版本 ' + revision + '　｜　收件對象：IQ-1203 校方開標人員' + (revision > 1 ? '。確認後以上述修訂版作準，原有收件紀錄保留。' : '。'));
      container.append(button('確認並提交示範報價', 'portal-cta', () => {
        data.submissionVersion = revision;
        complete();
      }));
      return;
    }

    if (type === 'open' && role === 'teacher') {
      head('在校方裝置開標', '示範時間已過 12 月 3 日 17:00。校方收到 3 份報價，可以在這個頁面查看樣本明細。');
      note('已交　甲、乙、己　｜　未交　丙、戊');
      note('這次使用內置示範資料，毋須選取真正的校方私鑰。');
      container.append(button('在本機開啟示範報價', 'portal-cta', () => {
        container.replaceChildren();
        container.scrollTop = 0;
        head('比較 3 份示範報價', '以下按全期應付總額排列。必收交通費已計入，供校方按採購程序評核。');
        note('甲公司　HK$24,800｜全期總額，已包括交通費。', 'portal-status');
        note('乙公司　HK$25,600｜課程 HK$24,000 ＋ 必收交通費 HK$1,600。');
        note('己公司　HK$26,400｜全期總額，已包括交通費。');
        container.append(button('完成查看，返回對話', 'portal-cta', () => { data.demoOpened = true; complete(); }));
      }));
      return;
    }

    if (type === 'question' && (role === 'teacher' || role === 'supplier')) {
      const teacher = role === 'teacher';
      head(teacher ? '發布校方共同答覆' : '送交正式問題', teacher
        ? '發布後，所有獲派公司及其後補位的公司，都可在項目頁看到同一則答覆。'
        : '只在此填寫希望校方正式澄清的要求。校方可把適用於各公司的共同答覆發布在項目頁。');
      if (teacher) note('共同問題　必收交通費是否須計入全期總額？');
      const { form, fields } = makeForm();
      const field = teacher ? 'publishedAnswer' : 'supplierQuestion';
      const preset = teacher ? '必收交通費須計入全期總額，並另行列明金額。' : '必收交通費是否須計入全期總額？';
      const body = textField(fields, 'question', teacher ? '供應商會看到的答覆' : '給校方的問題', data[field] || preset, '', true);
      submitButton(form, teacher ? '確認發布共同答覆' : '確認送交校方', () => {
        if (!body.value.trim()) { body.setCustomValidity('請填寫內容。'); body.reportValidity(); return; }
        data[field] = body.value.trim();
        complete();
      });
      body.oninput = () => body.setCustomValidity('');
      return;
    }

    if (type === 'case') {
      head('建立客服個案', '請用個案編號及問題類型交代情況。示範個案只會留在這次模擬。');
      const { form, fields } = makeForm();
      const select = element('select');
      ['交件或收件狀態', '校方開標或備份', '派單或評分覆核', '其他查詢'].forEach(value => select.append(element('option', '', value)));
      addField(fields, 'sim-case-type', '問題類型', select);
      const details = textField(fields, 'case-note', '補充說明（選填）', '', '例如：重新開啟專頁後，仍未看到收件紀錄。');
      submitButton(form, '建立示範客服個案', () => {
        const serial = (Number(data.caseCount) || 0) + 1;
        data.caseCount = serial;
        data.lastTicket = { id: 'IQ-1203-S' + String(serial).padStart(2, '0'), category: select.value, details: details.value.trim() };
        complete();
      });
      return;
    }

    head('返回目前角色', '這個頁面只供該宗詢價的指定角色使用。');
    container.append(button('返回對話', 'portal-secondary', cancel));
  };
})();

(() => {
  'use strict';
  const {create,icon,shell,message,action:actionButton}=window.WAFrame;
  const $=selector=>document.querySelector(selector);
  const scenarios={teacher:['老師','整理需求、保存私鑰、確認派單','school'],supplier:['供應商','接受配對、提問、提交報價','supplier'],support:['客服','查交件、私鑰及評分問題','support']};
  const sessions=new Map();
  let role, activePortal,focusReturn, sheetReturn;
  $('.device-area').insertAdjacentHTML('afterbegin',shell());
  const chat=$('.chat-body'), phone=$('.phone'), menu=$('.role-menu'), portal=$('.portal-layer');
  const input=$('#message'), send=$('.send-btn');
  const nodes=(selector)=>Array.from(document.querySelectorAll(selector));
  const get=()=>sessions.get(role);
  const hashRole=()=>location.hash.slice(1).split('/');
  function dayTime(state, fallback) {
    if(state==='cutoff'||state==='opened') return ['12月3日 星期四','17:00'];
    if(['progress','answered'].includes(state)) return ['12月3日 星期四','14:45'];
    return fallback;
  }
  function start(which,initial) {
    const selected=SIM[which].states[initial]?initial:SIM[which].initial;
    const session={id:selected,log:[],serial:0,data:{sessions:8,hours:2,tutors:3,fees:'請分列教材、必收交通費及全期總額。',version:1},day:'11月30日 星期一',time:'09:41',draft:''};
    sessions.set(which,session);
    if(initial==='confirm'&&which==='teacher'){
      session.data.formalSaved=true;
      session.data.backupAcknowledged=true;
      session.log.push({from:'me',text:'想辦小六升中面試班，一共 8 節。',time:'09:38',day:session.day},
        {from:'bot',text:'收到。正式時間表可以喺校方專頁提交，開標私鑰亦喺校方裝置保存。',time:'09:39',day:session.day});
    }
    addState(which,selected);
  }
  function addState(which,id){
    const session=sessions.get(which),state=SIM[which].states[id];
    session.id=id;session.serial++;session.pending=null;
    [session.day,session.time]=dayTime(id,[session.day,session.time]);
    let messages=state.messages;
    if(which==='teacher'&&id==='confirm'){
      const d=session.data,dates=d.schedule||'2027 年 1 月 5、7、12、14、19、21、26、28 日，每節 10:00–12:00';
      messages=[{text:'IQ-1203 · 正式版 v'+d.version+'\n小六升中面試班\n'+dates+'\n全期 '+d.sessions+' 節，每節 '+d.hours+' 小時，同時 '+d.tutors+' 位導師。'},
        {text:(d.fees||'請分列教材、必收交通費及全期總額。')+'\n12 月 3 日下午 5 時截標。確認後，平台會自動配對並逐間通知 5 間供應商。'}];
    }
    messages.forEach((entry,index)=>session.log.push({from:entry.from||'bot',text:entry.text,time:session.time,day:session.day,
      actions:index===messages.length-1?state.actions:null,serial:session.serial}));
  }
  function includeText(text,from='me'){
    const s=get();s.log.push({text,from,day:s.day,time:s.time});
  }
  function choose(choice,{typed=''}={}){
    const s=get();
    if(choice.portal){
      if(s.pending||SIM[role].states[s.id].actions.length===1){
        showPortal(choice);return;
      }
      includeText(typed||choice.label);
      s.serial++;
      s.pending=choice;
      s.log.push({text:'請按下方連結到 InstiQuote 專頁繼續。',from:'bot',day:s.day,time:s.time,serial:s.serial,actions:[choice]});
    }else{
      includeText(typed||choice.label);
      addState(role,choice.next);
    }
    render();
  }
  function showPortal(choice){
    focusReturn=document.activeElement;
    activePortal=choice;
    portal.hidden=false;
    const container=$('.portal-content');container.replaceChildren();container.scrollTop=0;
    $('.portal-bar strong').innerHTML=icon('lock')+' InstiQuote 安全專頁';
    window.renderSimPortal({type:choice.portal,role,data:get().data,container,
      complete:()=>{if(activePortal!==choice)return;hidePortal(false);addState(role,choice.next);render();focusActive();},
      cancel:()=>hidePortal(true)});
    $('.portal-close').focus({preventScroll:true});
  }
  function hidePortal(restore=true){portal.hidden=true;activePortal=null;if(restore&&focusReturn?.isConnected)focusReturn.focus({preventScroll:true});}
  $('.portal-close').onclick=()=>hidePortal();
  function focusActive(){(chat.querySelector('.chat-action:not(:disabled)')||input).focus({preventScroll:true});}
  function scrollEnd(){chat.scrollTop=chat.scrollHeight;requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight;});}
  function updateInput(){
    const blank=!input.value.trim();send.classList.toggle('blank',blank);
    send.innerHTML=icon(blank?'mic':'send');send.setAttribute('aria-label',blank?'語音示範說明':'傳送訊息');
    $('.composer-camera').hidden=!blank;
  }
  function render(){
    const s=get();chat.replaceChildren();
    $('.clock-text').textContent=s.time.replace(/^0/,'');
    $('.contact strong').textContent=role==='support'?'InstiQuote 客服':'InstiQuote 校園報價';
    let lastDay='';
    for(const e of s.log){
      if(e.day!==lastDay){chat.append(create('div','day',e.day));lastDay=e.day;}
      const bubble=message(e.text,{out:e.from==='me',time:e.time});chat.append(bubble);
      if(e.actions?.length){
        bubble.classList.add('with-actions');
        const buttons=create('div','actions bubble-actions');
        e.actions.forEach(choice=>{
          const link=Boolean(choice.portal&&e.actions.length===1), b=actionButton(choice.label,{portal:link});
          b.disabled=e.serial!==s.serial;
          b.onclick=()=>{if(e.serial===get().serial)choose(choice);};buttons.append(b);
        });
        chat.append(buttons);
      }
    }
    nodes('.role[data-role]').forEach(b=>{b.classList.toggle('active',b.dataset.role===role);b.setAttribute('aria-pressed',String(b.dataset.role===role));});
    input.value=s.draft||'';updateInput();scrollEnd();
  }
  function switchRole(which,initial,reset=false){
    if(!Object.hasOwn(SIM,which)) which='teacher';
    if(role&&get())get().draft=input.value;
    role=which;menu.hidden=true;hidePortal(false);
    if(reset||!sessions.has(role)||initial) start(role,initial);
    render();
  }
  function roleList(){
    const list=create('div','role-list');
    for(const [id,[label,caption,symbol]] of Object.entries(scenarios)){
      const b=create('button','role');b.type='button';b.dataset.role=id;
      b.innerHTML='<span class="role-icon">'+icon(symbol)+'</span><span class="role-copy"><strong>'+label+'</strong><small>'+caption+'</small></span><span class="chev">'+icon('chevron')+'</span>';
      b.classList.toggle('active',id===role);
      b.onclick=()=>{history.replaceState(null,'','#'+id);switchRole(id);};list.append(b);
    }return list;
  }
  function openMenu(kind){
    sheetReturn=document.activeElement;
    const box=$('.role-menu-inner');box.replaceChildren();
    if(kind==='roles'){
      box.append(create('h2','','示範對話'),roleList());
      const reset=create('button','portal-secondary','重新開始這個角色');reset.onclick=()=>{history.replaceState(null,'','#'+role);switchRole(role,undefined,true);};box.append(reset);
      const back=create('a','quick-preview','返回全流程圖解');back.href='InstiQuote-B-WhatsApp自動派單.html';box.append(back);
    }else{
      box.append(create('h2','',kind==='mic'?'語音訊息':'附件'),create('p','portal-lead',kind==='mic'?'此模擬器可使用文字及訊息按鈕。':'正式課程文件及報價經專屬頁面提交。你可以使用對話中的示範連結體驗。'));
    }
    const close=create('button','portal-secondary','關閉');close.onclick=closeMenu;box.append(close);
    menu.hidden=false;close.focus();
  }
  function closeMenu(){menu.hidden=true;if(sheetReturn?.isConnected)sheetReturn.focus({preventScroll:true});}
  $('.mobile-roles').onclick=()=>openMenu('roles');$('.help-btn').onclick=()=>openMenu('files');
  menu.addEventListener('click',e=>{if(e.target===menu)closeMenu();});
  input.addEventListener('input',()=>{get().draft=input.value;updateInput();});
  phone.querySelector('.composer').addEventListener('submit',e=>{
    e.preventDefault();const value=input.value.trim();if(!value){openMenu('mic');return;}
    const s=get();s.draft='';input.value='';updateInput();
    const current=s.pending?[s.pending]:SIM[role].states[s.id].actions;
    let match=current.find(a=>value.includes(a.label)||a.label===value);
    if(!match&&role==='teacher'&&s.id==='start'&&/課程|學校|升中|面試|補習|學班|樂器|講座|詢價/.test(value))match=current.find(a=>a.next==='ask');
    if(!match&&/真人|人工|客服/.test(value)&&role!=='support')match={label:'轉人工',next:'human'};
    if(!match&&s.id==='ask'&&role==='teacher'&&/[83八三]/.test(value)&&/導師/.test(value))match=current.find(a=>a.next==='dates');
    if(match){choose(match,{typed:value});return;}
    includeText(value);
    const options=current.map(a=>'「'+a.label+'」').join('、');
    s.serial++;
    s.log.push({from:'bot',text:options?'這個示範可選 '+options+'。':'這段示範已完成。可從角色選單重新開始。',actions:current,day:s.day,time:s.time,serial:s.serial});
    render();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!menu.hidden)closeMenu();else if(!portal.hidden)hidePortal();}
    if(e.key==='Tab'&&(!menu.hidden||!portal.hidden)){
      const box=menu.hidden?portal:menu,els=[...box.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),textarea,select')].filter(n=>n.getClientRects().length);
      if(els.length&&e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}
      else if(els.length&&!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}
    }
  });
  $('.role-picker').append(roleList());
  $('.reset-btn').innerHTML=icon('reset')+' 重新開始這個角色';
  $('.reset-btn').onclick=()=>{history.replaceState(null,'','#'+role);switchRole(role,undefined,true);};
  $('.brand-symbol').innerHTML=icon('book');
  function route(){const [which,initial]=hashRole();switchRole(which,initial);}
  window.addEventListener('hashchange',route);route();
})();
</script></body></html>
