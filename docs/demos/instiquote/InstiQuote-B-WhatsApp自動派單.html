  function render(screen, variant, stage, navigate) {

    const log = root.querySelector('.chat-body');
    log.setAttribute('aria-label',screen.view+'，對話示意');

          group.append(btn);
        });
        log.append(group);
      });
    });
    outer.append(host);
    if (screen.foot||screen.hint) outer.append(create('p','wa-guide-foot',screen.foot||screen.hint));
    outer.append(link(cfg.role));
    return outer;
  }

const mode=data.variant==='wa'?'WhatsApp AI 助手':'網站自動派單';document.title=data.title+' · InstiQuote';$('title').textContent=data.title;$('sub').textContent=data.subtitle||'';$('mode').textContent=mode;
if(data.other?.file&&/^[^/\\:]+\.html$/.test(data.other.file)){$('comp').href='./'+encodeURIComponent(data.other.file);$('comp').textContent=data.other.label||'切換版本';}else{$('comp').hidden=true;}
const routeData=[['校方','確認需求'],['平台','篩選五間'],['WhatsApp','自動通知'],['供應商','提問及交件'],['校方','截標後開啟'],['營運／客服','跟進與覆核']];
function route(){const n=el('ol','route');n.setAttribute('aria-label','全流程');routeData.forEach(x=>n.append(add(el('li'),el('small','',x[0]),el('b','',x[1]))));return n;}
function facts(rows=[]){const n=el('dl','fields');rows.forEach(r=>n.append(add(el('div','frow'),el('dt','',r.label),el('dd','',r.value))));return n;}
function actions(sc){if(!sc.actions?.length)return;const n=el('div','ui-actions');sc.actions.forEach(a=>{const label=typeof a==='string'?a:a.label||a.title;const id=sc.targets?.[label];const to=id&&flat.findIndex(x=>x.stage.id===id);if(typeof to==='number'&&to>=0){const b=el('button','mockbtn',label);b.type='button';b.title='查看對應步驟';b.onclick=()=>go(to,true);n.append(b);}else{n.append(el('span','mockbtn',label));}});return n;}
function head(sc){return add(el('div','viewhead'),el('h4','',sc.view||sc.app),sc.status&&el('span','pill',sc.status));}
function sky(sc){return add(el('div','uihead'),el('b','',sc.app||'工作台'),el('small','','InstiQuote'));}
function foot(sc){return(sc.foot||sc.hint)&&el('p','foot',sc.foot||sc.hint);}
function phbar(){return add(el('div','phonebar'),el('span','','9:41'),el('i','speaker'),el('span','','•••'));}
function panel(sc,t){const phone=t==='mobile',n=el('div','ui '+(phone?'phone':t));n.append(phone?phbar():add(el('div','browser'),el('span','dots','●●●'),el('span','','工作台介面示意')),sky(sc));const body=el('div','mockbody');if(!phone){const rail=el('div','rail');(t==='ops'?['派單','供應商','收件','紀錄']:t==='support'?['個案','跟進','覆核']:['詢價','進度','開標']).forEach(v=>rail.append(el('span','',v)));body.append(rail);}body.append(add(el('div','mockmain'),head(sc),facts(sc.rows),actions(sc),foot(sc)));n.append(body);if(phone)n.append(el('i','homebar'));return n;}
function chat(sc,st){return WAGuide.render(sc,data.variant,st.id,id=>{const i=flat.findIndex(x=>x.stage.id===id);if(i>=0)go(i,true);});}
function journey(sc){const n=el('div','ui'),rows=el('ol','journeyrows');(sc.rows||[]).forEach(r=>rows.append(add(el('li'),el('strong','',r.label),el('small','',r.value))));add(n,sky(sc),add(el('div','mockmain'),head(sc),rows,actions(sc),foot(sc)));return n;}
function sourceLinks(cls){if(!data.sources?.length)return;const n=el('div',cls);n.append(el('b','','參考資料'));data.sources.forEach(z=>{let u;try{u=new URL(z.url);}catch{return;}if(u.protocol!=='https:')return;const a=el('a','',z.label||u.host);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';n.append(a);});return n;}
function makePage(role,st,i){const n=el('article','stage');n.id='stage-'+st.id;n.style.setProperty('--accent',color[roles.indexOf(role)%color.length]);add(n,add(el('div','pbar'),el('b','','InstiQuote · '+mode),el('span','','設計示意　'+(i+1)+' / '+flat.length)),add(el('div','meta'),el('i','dot'),el('span','',role.label),el('span','','第 '+(i+1)+' / '+flat.length+' 步')),el('h2','',st.title),el('p','lead',st.lead));if(i===0)n.append(route());
const sc=st.screen||{},v=el('figure'),t=sc.type||'portal',wa=/chat|whatsapp|^wa$/.test(t),flow=/journey|overview|timeline/.test(t);v.append(el('figcaption','caption',wa?'WhatsApp 對話畫面':flow?'全流程示意':'工作台畫面示意'),wa?chat(sc,st):flow?journey(sc):panel(sc,t));if(!wa&&['support','supplier','school'].includes(role.id))v.append(WAGuide.link(role.id==='school'?'teacher':role.id));const l=el('ol','how');(st.steps||[]).forEach((p,j)=>l.append(add(el('li'),el('span','n',String(j+1).padStart(2,'0')),add(el('div'),el('h3','',p.title),el('p','',p.text)))));n.append(add(el('div','pair'),v,add(el('section'),el('h3','howtitle','操作流程'),l)));if(st.branch?.when||st.branch?.then)n.append(add(el('aside','branch'),el('h3','',st.branch.when),el('p','',st.branch.then)));if(i===flat.length-1)add(n,sourceLinks('psources'));return n;}
const ps=[],as=[],bs=[],ms=[];let ix=0,current=0;
roles.forEach((r,j)=>{const g=el('div','group'),b=el('button','groupbtn');const start=ix;b.type='button';b.style.setProperty('--accent',color[j%color.length]);add(b,el('i','dot'),el('span','',r.label));b.onclick=()=>go(start,false);const m=el('ol');m.id='role-list-'+j;b.setAttribute('aria-controls',m.id);bs.push(b);ms.push(m);r.stages.forEach(st=>{const pos=ix++,p=makePage(r,st,pos),a=el('a');a.href='#'+encodeURIComponent(st.id);add(a,el('span','count',String(pos+1).padStart(2,'0')),el('span','',st.title));a.onclick=e=>{e.preventDefault();go(pos,true);};as.push(a);ps.push(p);m.append(add(el('li'),a));$('stages').append(p);});$('toc').append(add(g,b,m));});add($('sources'),sourceLinks('sources'));
function show(n,scroll){if(!flat.length)return;current=Math.min(flat.length-1,Math.max(0,n));const r=flat[current].role,st=flat[current].stage;ps.forEach((p,i)=>p.classList.toggle('current',i===current));as.forEach((a,i)=>{if(i===current)a.setAttribute('aria-current','step');else a.removeAttribute('aria-current');});roles.forEach((q,j)=>{const yes=r===q;bs[j].setAttribute('aria-expanded',String(yes));ms[j].hidden=!yes;});$('dirlabel').textContent='角色與步驟　·　'+r.label;$('prev').disabled=current===0;$('next').textContent=current===flat.length-1?'返回開首':'下一步 →';$('pos').textContent=(current+1)+' / '+flat.length;$('live').textContent=r.label+'，'+st.title;if(scroll){$('dir').classList.remove('open');$('toggle').setAttribute('aria-expanded','false');$('toggle').textContent='展開';(matchMedia('(max-width:900px)').matches?$('dir'):$('main')).scrollIntoView({block:'start'});}}
function go(i,scroll=true){show(i,scroll);const h='#'+encodeURIComponent(flat[current].stage.id);if(location.hash!==h)try{history.pushState(null,'',h);}catch{location.hash=h;}}
function deep(){let h;try{h=decodeURIComponent(location.hash.slice(1));}catch{}const i=flat.findIndex(x=>x.stage.id===h);show(i<0?0:i,false);}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current===flat.length-1?0:current+1);$('toggle').onclick=()=>{const yes=$('dir').classList.toggle('open');$('toggle').setAttribute('aria-expanded',String(yes));$('toggle').textContent=yes?'收起':'展開';};$('print').onclick=()=>window.print();onhashchange=deep;onpopstate=deep;document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(e.key==='ArrowLeft'&&current>0){e.preventDefault();go(current-1);}if(e.key==='ArrowRight'&&current<flat.length-1){e.preventDefault();go(current+1);}});deep();
})();</script></body></html>
